# Mapping: dbo.ShiftRejectionDetails (SQL Server) -> analytics_historic.shift_rejection_details (PostgreSQL)
# Status: DRAFT - awaiting owner decisions (see open_questions)
# Wave: after master_data. Conventions (null handling, no dropped rows, lookups): see ../master_data/_conventions.yaml
#
# Checked on 2026-11-25 against the live pair TPM_PGSQL (source) and tpm_baseline_qa (target):
#   - the source table holds only the parent's ID, the code and the quantity. ID is the ID of the row of
#     dbo.ShiftProductionDetails the rejection belongs to; Slno is the row's own serial number. The date, shift, plant, group,
#     machine, component, operation, operator, work order and heat code come from that parent row, so the source is read
#     with a LEFT JOIN to it (source.join; parent columns are named p.<column>).
#   - ShiftRejectionDetails has 2 rows on TPM_PGSQL (both of parent ID 273); the live target table is empty, so no live value could be compared.

source:
  database: TPM_PGSQL
  schema: dbo
  table: ShiftRejectionDetails
  natural_key: [Slno]
  join:                                  # the parent row: ShiftProductionDetails.ID = ShiftRejectionDetails.ID
    table: ShiftProductionDetails
    match: {ID: ID}                    # child column: parent column

target:
  schema: analytics_historic
  table: shift_rejection_details
  primary_key: [id]                      # id has a default sequence
  unique: [[production_date, shift_id, plant_iot_id, group_iot_id, machine_iot_id, component_iot_id, operation_number, operator_iot_id, work_order_number, heat_code, rejection_iot_id]]
  dedupe: [[production_date, shift_id, plant_iot_id, group_iot_id, machine_iot_id, component_iot_id, operation_number, operator_iot_id, work_order_number, heat_code, rejection_iot_id]]   # unique index uq_shift_rejection_details_key: first row of a key stays, the rest are listed as duplicate_key

depends_on: [plant_information, plant_groups, machine_information, component_information, component_operation_pricing, employee_information, shift_details, rejection_code_information]

batching:
  strategy: date_window
  mode: days                             # production_date is a plain date, so fixed windows are enough
  days: 30
  column: p.pDate                        # the parent's date decides the window
  boundaries: half_open
  null_window: true                      # a row without a parent has no date: it is read and listed as an exception

columns:
  # --- when (from the parent row) ---
  - {dst: production_date, src: p.pDate, rule: copy}
  - {dst: shift_name,      src: p.Shift, rule: copy}
  - {dst: shift_id,        src: p.Shift, rule: lookup, table: shift_details, match: {shift_name: p.Shift}, return: shift_id}

  # --- who / what (from the parent row) ---
  - {dst: plant_iot_id,      src: p.PlantID,     rule: lookup, table: plant_information,      match: {plant_id: p.PlantID},         return: iot_id}
  - {dst: group_iot_id,      src: p.GroupID,     rule: lookup, table: plant_groups,           match: {group_id: p.GroupID},         return: iot_id}
  - {dst: machine_iot_id,    src: p.MachineID,   rule: lookup, table: machine_information,    match: {machine_id: p.MachineID},     return: iot_id}
  - {dst: component_iot_id,  src: p.ComponentID, rule: lookup, table: component_information, match: {component_id: p.ComponentID}, return: iot_id}
  - {dst: operation_iot_id,  src: p.OperationNo, rule: lookup, table: component_operation_pricing, match: {machine_iot_id: "@machine_iot_id", component_iot_id: "@component_iot_id", operation_no: p.OperationNo}, return: iot_id}
  - {dst: operator_iot_id,   src: p.OperatorID,  rule: lookup, table: employee_information,   match: {employee_id: p.OperatorID},   return: iot_id}
  - {dst: plant_id,          src: p.PlantID,     rule: copy}
  - {dst: group_id,          src: p.GroupID,     rule: copy}
  - {dst: machine_id,        src: p.MachineID,   rule: copy}
  - {dst: component_id,      src: p.ComponentID, rule: copy}
  - {dst: operation_number,  src: p.OperationNo, rule: copy}
  - {dst: operator_id,       src: p.OperatorID,  rule: copy}
  - {dst: work_order_number, src: p.WorkOrderNumber, rule: coalesce, fallback: "0"}   # NULL becomes '0'
  - {dst: heat_code,         src: p.HeatCode,        rule: coalesce, fallback: "0"}   # NULL becomes '0'

  # --- the rejection ---
  - {dst: rejection_id,         src: Rejection_Reason, rule: copy}                  # the source holds the code in its reason column (for example 'Rejection Code-1')
  - {dst: rejection_iot_id,     src: Rejection_Reason, rule: lookup, table: rejection_code_information, match: {rejection_id: Rejection_Reason}, return: rejection_number}   # the master's number, as the live code does
  - {dst: rejection_reason,     src: Rejection_Reason, rule: lookup, table: rejection_code_information, match: {rejection_id: Rejection_Reason}, return: rejection_description, report_miss: false}   # the master's description of the code (owner's decision)
  - {dst: rejection_quantity,   src: Rejection_Qty, rule: copy, null_as: zero}                     # int -> integer; NULL = 0, like the column default
  - {dst: rejected_timestamp, src: UpdatedTS, rule: copy}           # the live code stores NOW() when the entry is made; the source time is the nearest value
  - {dst: updated_by,   src: UpdatedBy, rule: copy}
  - {dst: updated_at,   src: UpdatedTS, rule: copy}

# Target columns not written by this file
defaults:
  id: sequence shift_rejection_details_id_seq        # generated by the target

# Source columns with no target
unmapped_source:
  - ID      # the parent's ID: used only for the join
  - Slno    # the row's own serial number: the target generates its own id

open_questions:
  - "rejection_reason: decided by the owner: it is the master's rejection_description for the code in the source (the source itself has no separate text). A code that is not in the master gives NULL."
  - "The live target already holds rows written by its own aggregation / job card screens. A window load deletes the target rows of its date range first, so a run against that target would delete live rows. Run it against an empty target only."
  - "A row whose parent (ShiftProductionDetails.ID) does not exist has no date, shift or machine: it is listed as an exception (production_date and shift_name are NOT NULL). A code that is not in the master gets rejection_iot_id NULL."
  - "The live code adds the quantities of rows with the same key (rejection_iot_id included); the source rows are copied one for one. Two source rows with the same key keep the first and list the second as duplicate_key."

checks:
  - "production_date and shift_name are resolved for every row"       # NOT NULL in the target
  - "the dimension key plus rejection_iot_id is unique"                    # unique index in the target
  - "rows read = rows loaded + exceptions"
