# Mapping: EmployeeRoles_Master (SQL Server) -> master_data.employee_roles_master (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 1 of lookup order (no dependencies)

source:
  database: TPM_PGSQL
  schema: dbo
  table: EmployeeRoles_Master
  natural_key: [RoleID]

target:
  schema: master_data
  table: employee_roles_master
  primary_key: [iot_id]          # generated by sequence employee_roles_master_iot_id_seq
  unique: []                     # none on the target (see checks)

columns:
  - {dst: role_id,          src: RoleID,          rule: copy}   # int NN         -> integer (nullable in target)
  - {dst: role_description, src: RoleDescription, rule: copy}   # nvarchar(100)  -> text
  - {dst: updated_by,       src: UpdateBy,        rule: coalesce, fallback: pct}   # nvarchar(150)  -> text; NULL becomes 'pct' (note: source name is UpdateBy, not UpdatedBy)
  - {dst: updated_at,       src: UpdatedTS,       rule: copy}   # datetime -> timestamp; the column has no DDL default, so NULL stays NULL

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence employee_roles_master_iot_id_seq

# Source columns with no target: none
unmapped_source: []

checks:
  - role_id is NOT NULL and unique   # target allows NULL and has no UNIQUE constraint, but role_id is the business identifier of a role
