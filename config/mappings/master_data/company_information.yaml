# Mapping: company (SQL Server) -> master_data.company_information (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 1 of lookup order (no dependencies)

source:
  database: TPM_PGSQL
  schema: dbo
  table: company
  natural_key: [CompanyName]     # CompanyID is renamed to CompanyName in the new design, so CompanyName is the identifier

target:
  schema: master_data
  table: company_information
  primary_key: [iot_id]          # generated by sequence company_information_iot_id_seq
  unique: []                     # no unique constraint on the target

columns:
  - {dst: company_name,       src: CompanyName,   rule: copy}                 # nvarchar(100) NN -> text
  - {dst: contact_person,     src: ContactPerson, rule: copy}                 # nvarchar(100) NN -> text
  - {dst: address_1,          src: Address1,      rule: copy}                 # nvarchar(100)    -> text
  - {dst: address_2,          src: Address2,      rule: copy}                 # nvarchar(100)    -> text
  - {dst: place,              src: Place,         rule: copy}                 # nvarchar(50)     -> text
  - {dst: state,              src: State,         rule: copy}                 # nvarchar(50)     -> text
  - {dst: country,            src: Country,       rule: copy}                 # nvarchar(50)     -> text
  - {dst: pin,                src: PIN,           rule: copy}                 # nvarchar(50)     -> text
  - {dst: phone,              src: Phone,         rule: copy}                 # nvarchar(50)     -> text
  - {dst: fax,                src: Fax,           rule: copy}                 # nvarchar(50)     -> text
  - {dst: email,              src: email,         rule: copy}                 # nvarchar(100)    -> text
  - {dst: number_of_machines, src: noofmachine,   rule: cast, to: integer}    # smallint         -> integer (widening, safe)

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence company_information_iot_id_seq
  updated_at: CURRENT_TIMESTAMP      # column default
  company_logo: NULL                 # bytea, no source column

# Source columns with no target
unmapped_source:
  - CompanyID                        # intentionally dropped: replaced by company_name as the unique identifier (confirmed by owner)

checks:
  - company_name is NOT NULL and unique across rows   # target has no UNIQUE constraint: validation only, rows are loaded and duplicates are listed in the exceptions report

decisions:
  - "company_logo is NULL for now (no source column). Confirmed by owner; it can be filled in later."
