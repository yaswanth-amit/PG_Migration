# Mapping: customerinformation (SQL Server) -> master_data.customer_information (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 1 of lookup order (no dependencies)

source:
  database: TPM_PGSQL
  schema: dbo
  table: customerinformation
  natural_key: [customerid]

target:
  schema: master_data
  table: customer_information
  primary_key: [iot_id]          # generated by sequence customer_information_iot_id_seq
  unique: [[customer_id]]

columns:
  # target column      source column   source type        target type   rule
  - {dst: customer_id,    src: customerid,    rule: copy}      # nvarchar(50) NN   -> text NN
  - {dst: customer_name,  src: customername,  rule: copy}      # nvarchar(100)     -> text
  - {dst: address1,       src: address1,      rule: copy}      # nvarchar(100)     -> text
  - {dst: place,          src: place,         rule: copy}      # nvarchar(100)     -> text
  - {dst: state,          src: state,         rule: copy}      # nvarchar(100)     -> text
  - {dst: country,        src: country,       rule: copy}      # nvarchar(100)     -> text
  - {dst: pin,            src: pin,           rule: copy}      # nvarchar(100)     -> text
  - {dst: phone,          src: phone,         rule: copy}      # nvarchar(100)     -> text
  - {dst: email,          src: email,         rule: copy}      # nvarchar(100)     -> text
  - {dst: contact_person, src: contactperson, rule: copy}      # nvarchar(100)     -> text
  - {dst: address2,       src: address2,      rule: copy}      # nvarchar(50)      -> text

# Target columns with no source: not written by the migration, DB default applies
defaults:
  iot_id: sequence customer_information_iot_id_seq
  is_active: "true"                  # column default
  updated_at: CURRENT_TIMESTAMP      # column default
  updated_by: "pct"                  # no source; constant 'pct' (owner's rule: updated_by NULL becomes 'pct')

# Source columns with no target: none
unmapped_source: []

checks:
  - customer_id is NOT NULL and unique   # target UNIQUE(customer_id): a duplicate cannot be loaded; it is listed in the exceptions report, never silently dropped
