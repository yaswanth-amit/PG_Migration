# Mapping: PlantMachineGroups (SQL Server) -> master_data.plant_groups (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 2 of lookup order. Depends on: plant_information. Referenced by scheduled_reports (group_iot_id lookup).
# DERIVED table: the source has no dedicated groups table. One group row is built per distinct (PlantID, GroupID)
# found in PlantMachineGroups. PlantMachineGroups is also the source of plant_machine_groups.
# Conventions (null handling, no dropped rows, updated_at, lookups): see _conventions.yaml

source:
  database: TPM_PGSQL
  schema: dbo
  table: PlantMachineGroups
  group_by: [PlantID, GroupID]       # one output row per distinct pair
  natural_key: [PlantID, GroupID]

target:
  schema: master_data
  table: plant_groups
  primary_key: [iot_id]          # generated by sequence plant_groups_iot_id_seq
  unique: [[plant_iot_id, group_id]]   # UNIQUE (plant_iot_id, group_id)
  foreign_keys:
    - {columns: [plant_iot_id], references: plant_information(iot_id)}

depends_on: [plant_information]

columns:
  - {dst: plant_iot_id, src: PlantID,     rule: lookup, table: plant_information, match: {plant_id: PlantID}, return: iot_id}   # nvarchar(50) NN -> integer NN
  - {dst: group_id,     src: GroupID,     rule: copy}                                     # nvarchar(50) NN -> text NN
  - {dst: description,  src: description, rule: first_non_null, order_by: [MachineSequence, MachineID]}   # nvarchar(100) -> text; one value per group
  - {dst: updated_at,   src: UpdatedTS,   rule: max, null_as: ddl_default}                # datetime -> timestamp; latest UpdatedTS in the group; NULL becomes the DDL default (CURRENT_TIMESTAMP)
  - {dst: updated_by,   src: null,        rule: constant, value: pct}                     # no source; constant 'pct' (owner's rule)

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence plant_groups_iot_id_seq

# Source columns that do not belong to the group (they go to plant_machine_groups)
not_used_here:
  - MachineID
  - GroupOrder
  - EndOfLineMachine
  - EndOfGroupMachine
  - MachineSequence

checks:
  - "plant_iot_id is resolved for every group"      # NOT NULL foreign key: an unmatched PlantID cannot be loaded; it is listed in the exceptions report
  - "(plant_iot_id, group_id) is unique"            # guaranteed by the group-by; target UNIQUE constraint

decisions:
  - "Groups are built from the distinct (PlantID, GroupID) pairs in PlantMachineGroups. Confirmed by owner."
  - "description = the first non-NULL description in the group, in MachineSequence order. Accepted by owner."
