# Mapping: employeeinformation (SQL Server) -> master_data.employee_information (PostgreSQL)
# Status: all questions answered - awaiting final approval
# Wave: 1 of lookup order (no dependencies). Referenced by plant_employee.
# SENSITIVE: contains upassword. Never log row values for this table.

source:
  database: TPM_PGSQL
  schema: dbo
  table: employeeinformation
  natural_key: [Employeeid]

target:
  schema: master_data
  table: employee_information
  primary_key: [iot_id]          # generated by sequence employee_information_iot_id_seq
  unique: []                     # none on the target (see checks)

columns:
  - {dst: employee_id,     src: Employeeid,    rule: copy}                          # nvarchar(50) NN  -> text NN
  - {dst: interface_id,    src: interfaceid,   rule: coalesce, fallback_col: Employeeid}   # nvarchar(50) -> text NN; target NOT NULL, so NULL becomes Employeeid
  - {dst: employee_no,     src: employeeno,    rule: cast, to: text}                # int              -> text
  - {dst: name,            src: Name,          rule: coalesce, fallback_col: Employeeid}   # nvarchar(150) -> text NN; target NOT NULL, so NULL becomes Employeeid
  - {dst: designation,     src: designation,   rule: copy}                          # nvarchar(100)    -> text
  - {dst: qualification,   src: qualification, rule: copy}                          # nvarchar(100)    -> text
  - {dst: address1,        src: address1,      rule: copy}                          # nvarchar(100)    -> text
  - {dst: address2,        src: address2,      rule: copy}                          # nvarchar(100)    -> text
  - {dst: phone,           src: phone,         rule: copy}                          # nvarchar(50)     -> text
  - {dst: email,           src: Email,         rule: copy}                          # nvarchar(500)    -> text
  - {dst: mobileno,        src: MobileNo,      rule: copy}                          # nvarchar(500)    -> text
  - {dst: status,          src: status,        rule: map, values: {1: Active}, else: Inactive}   # smallint -> text; 1 = Active, anything else (including NULL) = Inactive
  - {dst: is_admin,        src: isadmin,       rule: bool, null_as: false}          # smallint         -> boolean; 0/NULL = false, non-zero = true
  - {dst: upassword,       src: upassword,     rule: copy, sensitive: true}         # nvarchar(15)     -> text (see decisions)
  - {dst: landing_page,    src: LandingPage,   rule: copy}                          # nvarchar(50)     -> text
  - {dst: company_default, src: Company_default, rule: copy}                        # bit              -> boolean
  - {dst: role,            src: Role,          rule: copy}                          # nvarchar(50)     -> text (see decisions)
  - {dst: updated_at,      src: UpdatedTS,     rule: coalesce, fallback: load_time} # datetime         -> timestamp; NULL becomes load time

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence employee_information_iot_id_seq
  is_active: "true"                  # column default; source has no equivalent

# Source columns with no target
unmapped_source:
  - operate           # smallint NN - permission flag, no target column
  - setting           # smallint    - permission flag, no target column
  - maintain          # smallint    - permission flag, no target column
  - EmployeeImage     # varbinary   - biometric/photo, intentionally not migrated
  - EmpFingerprint1   # varbinary   - biometric, intentionally not migrated
  - EmpFingerprint2   # varbinary   - biometric, intentionally not migrated
  - EmployeeRole      # nvarchar(100) - target has one role column, mapped from Role

checks:
  - employee_id is NOT NULL and unique     # target has no UNIQUE constraint, but plant_employee looks employees up by employee_id
  - name and interface_id are NOT NULL after rules

decisions:
  - "interface_id = COALESCE(interfaceid, Employeeid). Confirmed by owner; same rule as rejection_code_information."
  - "name = COALESCE(Name, Employeeid). Confirmed by owner."
  - "status: source 1 -> 'Active', any other value or NULL -> 'Inactive'. Confirmed by owner."
  - "role: mapped from Role; EmployeeRole is intentionally dropped. Confirmed by owner."
  - "is_active: not derived from status; the column default (true) applies to every employee. Confirmed by owner."
  - "upassword: migrated as-is. Confirmed by owner. Remains marked sensitive: never logged or written to reject files."
  - "operate / setting / maintain / EmployeeImage / EmpFingerprint1 / EmpFingerprint2: intentionally not migrated. Confirmed by owner."
