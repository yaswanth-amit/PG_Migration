# Mapping: shiftdetails (SQL Server) -> master_data.shift_details (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 1 of lookup order (no dependencies). Referenced by shift_hour_definition (shift_name lookup by shift_id).

source:
  database: TPM_PGSQL
  schema: dbo
  table: shiftdetails
  natural_key: [shiftid]         # unique in the source (owner confirmed)

target:
  schema: master_data
  table: shift_details
  primary_key: [id]              # generated by sequence shift_details_id_seq; the source slno is not copied
  unique: []

columns:
  - {dst: shift_name, src: ShiftName, rule: coalesce, fallback: ""}                 # nvarchar(20)   -> text NN; NULL becomes '' (the target column default)
  - {dst: shift_id,   src: shiftid,   rule: cast, to: integer}                      # tinyint NN     -> integer NN (widening, safe)
  - {dst: is_running, src: Running,   rule: bool, null_as: ddl_default}             # smallint       -> boolean; 0 = false, non-zero = true, NULL becomes the DDL default (false)
  - {dst: from_day,   src: FromDay,   rule: cast, to: integer, null_as: ddl_default}   # smallint       -> integer; NULL becomes the DDL default (0)
  - {dst: to_day,     src: ToDay,     rule: cast, to: integer, null_as: ddl_default}   # smallint       -> integer; NULL becomes the DDL default (0)
  - {dst: from_time,  src: FromTime,  rule: copy}                                   # datetime       -> timestamp without time zone
  - {dst: to_time,    src: ToTime,    rule: copy}                                   # datetime       -> timestamp without time zone
  - {dst: updated_at, src: UpdatedTS, rule: copy}                                   # datetime       -> timestamp; the column has no DDL default, so NULL stays NULL
  - {dst: created_at, src: null,      rule: load_time}                              # no source column; set to the load time

# Target columns with no source: not written by the migration
defaults:
  id: sequence shift_details_id_seq

# Source columns with no target
unmapped_source:
  - slno         # int NN         - row number; the target generates id from its sequence instead
  - StartTime    # int            - start hour as a number; target keeps full from_time / to_time instead
  - NoofHrs      # int            - shift length in hours; derivable from from_time / to_time
  - fromdate     # smalldatetime  - effective date, no target column

checks:
  - shift_id is unique                   # shift_hour_definition looks up shift_name by shift_id; owner confirmed shiftid is unique in the source, so a duplicate would only be reported (no target constraint), and the row is still loaded

decisions:
  - "id is generated by the target sequence; source slno is not migrated. Confirmed by owner. No post-load sequence step is needed."
  - "shiftid is unique in the source; no filtering on Running. Confirmed by owner."
  - "created_at = load time (no source column). Confirmed by owner."
  - "A NULL in shift_name, is_running, from_day or to_day becomes the DDL default ('' / false / 0 / 0); the rule is: if NULL, use the DDL default, else keep NULL. Confirmed by owner. This replaces the earlier 'keep NULL' answer for is_running, from_day and to_day."
