# Mapping: PlantMachine (SQL Server) -> master_data.plant_machine (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 3 of lookup order. Depends on: plant_information, machine_information.
# Conventions (null handling, no dropped rows, updated_at, lookups): see _conventions.yaml

source:
  database: TPM_PGSQL
  schema: dbo
  table: PlantMachine
  natural_key: [PlantID, MachineID, SlNo]

target:
  schema: master_data
  table: plant_machine
  primary_key: [iot_id]          # generated by sequence plant_machine_iot_id_seq
  unique: []
  foreign_keys:
    - {columns: [plant_iot_id],   references: plant_information(iot_id)}
    - {columns: [machine_iot_id], references: machine_information(iot_id)}

depends_on: [plant_information, machine_information]

columns:
  - {dst: plant_iot_id,   src: PlantID,   rule: lookup, table: plant_information,   match: {plant_id: PlantID},     return: iot_id}   # nvarchar(50) NN -> integer NN
  - {dst: machine_iot_id, src: MachineID, rule: lookup, table: machine_information, match: {machine_id: MachineID}, return: iot_id}   # nvarchar(50) NN -> integer NN
  - {dst: from_time,      src: FromTime,  rule: copy}      # datetime -> timestamp without time zone
  - {dst: to_time,        src: ToTime,    rule: copy}      # datetime -> timestamp without time zone; NULL stays NULL (no DDL default)
  - {dst: updated_at,     src: UpdatedTS, rule: copy}      # datetime -> timestamp; the column has no DDL default, so NULL stays NULL

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence plant_machine_iot_id_seq
  is_active: "true"                  # column default; source has no equivalent

# Source columns with no target
unmapped_source:
  - SlNo        # int NN - row number; the target generates iot_id from its sequence instead

checks:
  - "plant_iot_id is resolved for every row"      # NOT NULL foreign key: an unmatched PlantID cannot be loaded; it is listed in the exceptions report
  - "machine_iot_id is resolved for every row"    # NOT NULL foreign key: an unmatched MachineID cannot be loaded; it is listed in the exceptions report
  - "(plant_iot_id, machine_iot_id, from_time) is unique"   # no target constraint: validation only, rows are loaded and duplicates are listed in the exceptions report

decisions:
  - "is_active is a soft-delete flag in the new design (not an assignment-period flag), so it is not derived from ToTime; the DDL default (true) applies to every row. Confirmed by owner."
  - "SlNo is not migrated; iot_id comes from the sequence (same rule as plant_employee and shift_details). Confirmed by owner."
