# Mapping: HolidayList (SQL Server) -> master_data.holiday_list (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 2 of lookup order. Depends on: machine_information (machine_iot_id lookup).

source:
  database: TPM_PGSQL
  schema: dbo
  table: HolidayList
  natural_key: [Holiday, MachineID]

target:
  schema: master_data
  table: holiday_list
  primary_key: [id]              # generated by sequence holiday_list_id_seq; the source has no id column
  unique: []

depends_on: [machine_information]

columns:
  - {dst: machine_iot_id, src: MachineID, rule: lookup, table: machine_information, match: {machine_id: MachineID}, on_miss: drop, return: iot_id}   # nvarchar(50) -> integer; NULL MachineID stays NULL
  - {dst: holiday,        src: Holiday,   rule: copy}    # datetime NN     -> timestamp without time zone
  - {dst: reason,         src: Reason,    rule: copy}    # nvarchar(50) NN -> text

# Target columns with no source: not written by the migration
defaults:
  id: sequence holiday_list_id_seq
  updated_at: CURRENT_TIMESTAMP      # column default; source has no UpdatedTS

# Source columns with no target: none
unmapped_source: []

checks:
  - "MachineID has a match in machine_information"   # on_miss: drop - a row whose machine is not present in machine_information is not migrated; it is listed in the exceptions report as dropped_no_parent (never silent)

decisions:
  - "Only machines present in machine_information are migrated: a holiday for any other machine is dropped (on_miss: drop) and listed as dropped_no_parent. Confirmed by owner on 2026-11-19. MachineID is never NULL in the source (owner), so no holiday is silently turned into a holiday for all machines."
