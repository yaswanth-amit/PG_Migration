# Mapping: PlantMachineGroups (SQL Server) -> master_data.plant_machine_groups (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 3 of lookup order. Depends on: plant_information, machine_information.
# Same source table as plant_groups; this output keeps one row per source row (plant + machine + group).
# Conventions (null handling, no dropped rows, updated_at, lookups): see _conventions.yaml

source:
  database: TPM_PGSQL
  schema: dbo
  table: PlantMachineGroups
  natural_key: [PlantID, MachineID, GroupID]

target:
  schema: master_data
  table: plant_machine_groups
  primary_key: [iot_id]          # generated by sequence plant_machine_groups_iot_id_seq
  unique: []
  foreign_keys:
    - {columns: [plant_iot_id],   references: plant_information(iot_id)}
    - {columns: [machine_iot_id], references: machine_information(iot_id)}

depends_on: [plant_information, machine_information]

columns:
  - {dst: plant_iot_id,   src: PlantID,   rule: lookup, table: plant_information,   match: {plant_id: PlantID},     return: iot_id}   # nvarchar(50) NN -> integer NN
  - {dst: machine_iot_id, src: MachineID, rule: lookup, table: machine_information, match: {machine_id: MachineID}, on_miss: drop, return: iot_id}   # nvarchar(50) NN -> integer
  - {dst: group_id,       src: GroupID,   rule: copy}                  # nvarchar(50) NN -> text NN
  - {dst: group_order,    src: GroupOrder, rule: copy}                 # int            -> integer
  - {dst: description,    src: description, rule: copy}                # nvarchar(100)  -> text
  - {dst: end_of_line_machine,  src: EndOfLineMachine,  rule: bool_from_text, true_values: ['1'], false_values: ['0']}   # nvarchar(50) -> boolean; any other value or NULL stays NULL (no DDL default)
  - {dst: end_of_group_machine, src: EndOfGroupMachine, rule: bool_from_text, true_values: ['1'], false_values: ['0']}   # nvarchar(50) -> boolean; any other value or NULL stays NULL (no DDL default)
  - {dst: machine_sequence, src: MachineSequence, rule: copy}          # int            -> integer
  - {dst: updated_at,     src: UpdatedTS, rule: copy}                  # datetime       -> timestamp; the column has no DDL default, so NULL stays NULL

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence plant_machine_groups_iot_id_seq

# Source columns with no target: none
unmapped_source: []

checks:
  - "plant_iot_id is resolved for every row"      # NOT NULL foreign key: an unmatched PlantID cannot be loaded; it is listed in the exceptions report
  - "MachineID has a match in machine_information"   # on_miss: drop - a row whose machine is not present in machine_information is not migrated; it is listed in the exceptions report as dropped_no_parent (never silent)
  - "(plant_iot_id, machine_iot_id, group_id) is unique"   # no target constraint: validation only, rows are loaded and duplicates are listed in the exceptions report

decisions:
  - "EndOfLineMachine and EndOfGroupMachine: '1' means true, '0' means false. Confirmed by owner. Any other value or NULL stays NULL (the target columns have no DDL default)."
