# Mapping: DownCategoryInformation (SQL Server) -> master_data.down_category (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 1 of lookup order (no dependencies). Referenced by down_code_information.

source:
  database: TPM_PGSQL
  schema: dbo
  table: DownCategoryInformation
  natural_key: [DownCategory]

target:
  schema: master_data
  table: down_category
  primary_key: [iot_id]          # generated by sequence down_category_iot_id_seq
  unique: []                     # none on the target (see checks)

columns:
  - {dst: category_name, src: DownCategory, rule: copy}   # nvarchar(50) NN -> text NN
  - {dst: description,   src: Description,  rule: copy}   # nvarchar(50)    -> text
  - {dst: updated_at,    src: UpdatedTS,    rule: coalesce, fallback: load_time}   # datetime -> timestamp without time zone; NULL becomes load time

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence down_category_iot_id_seq
  is_active: "true"                  # column default

# Source columns with no target: none
unmapped_source: []

checks:
  - category_name is NOT NULL and unique   # target has no UNIQUE constraint, but down_code_information looks rows up by category_name, so duplicates would make that lookup ambiguous

decisions:
  - "updated_at = COALESCE(UpdatedTS, load time). Confirmed by owner; apply the same rule to every other table that maps UpdatedTS."
