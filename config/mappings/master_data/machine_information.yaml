# Mapping: machineinformation (SQL Server) -> master_data.machine_information (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 1 of lookup order (no dependencies). Referenced by many tables (plant_machine, holiday_list, ...).
# The module flags in the same source row go to a second target, see machine_module_settings.yaml.

source:
  database: TPM_PGSQL
  schema: dbo
  table: machineinformation
  natural_key: [machineid]

target:
  schema: master_data
  table: machine_information
  primary_key: [iot_id]          # generated by sequence machine_information_iot_id_seq
  unique: []                     # none on the target (see checks)

columns:
  # --- identity ---
  - {dst: interface_id,   src: InterfaceID, rule: coalesce, fallback_col: machineid}   # nvarchar(50) -> text NN; NULL becomes machineid (same rule as other tables)
  - {dst: machine_id,     src: machineid,   rule: copy}                                # nvarchar(50) NN -> text NN
  - {dst: description,    src: description, rule: copy}                                # nvarchar(150) -> text
  - {dst: machine_owner,  src: MachinewiseOwner, rule: copy}                           # nvarchar(50)  -> text
  - {dst: machine_mtb,    src: MachineMTB,  rule: copy}                                # nvarchar(50)  -> text
  - {dst: controller_type, src: ControllerType, rule: copy}                            # nvarchar(500) NN -> text
  - {dst: device_type,    src: DeviceType,  rule: copy}                                # smallint -> smallint

  # --- flags ---
  - {dst: is_critical_machine,     src: CriticalMachineEnabled, rule: copy}            # bit -> boolean
  - {dst: tpm_trak_enabled,        src: TPMTrakEnabled,         rule: bool}            # smallint -> boolean; 0 = false, non-zero = true, NULL stays NULL
  - {dst: auto_setup_change_down,  src: AutoSetupchangeDown,    rule: bool_from_text, true_values: ['1', 'Y', 'y'], false_values: ['0', 'N', 'n']}   # nvarchar(25) -> boolean; any other value or NULL stays NULL (no DDL default)
  - {dst: dap_enabled,             src: DAPEnabled,             rule: copy}            # smallint -> smallint (not boolean in the target)
  - {dst: smart_transfer_enabled,  src: SmartTransEnabled,      rule: copy}            # bit -> boolean
  - {dst: ethernet_enabled,        src: EthernetEnabled,        rule: copy}            # bit NN -> boolean
  - {dst: nto1_device,             src: Nto1Device,             rule: copy}            # bit NN -> boolean
  - {dst: dnc_transfer_enabled,    src: DNCTransferEnabled,     rule: bool}            # smallint NN -> boolean; 0 = false, non-zero = true
  - {dst: mobile_enabled,          src: MobileEnabled,          rule: copy}            # bit -> boolean

  # --- rates ---
  - {dst: machine_hour_rate, src: mchrrate, rule: cast, to: numeric}                   # float -> numeric

  # --- network ---
  - {dst: ip_address,                 src: IP,                     rule: copy}         # nvarchar(20) -> text
  - {dst: ip_port_number,             src: IPPortNO,               rule: copy}         # nvarchar(10) -> text
  - {dst: port_no,                    src: portno,                 rule: cast, to: text}   # smallint -> text; a NULL portno stays NULL
  - {dst: bulk_data_transfer_port_no, src: BulkDataTransferPortNo, rule: copy}         # nvarchar(50) -> text
  - {dst: dnc_ip,                     src: DNCIP,                  rule: copy}         # nvarchar(20) -> text
  - {dst: dnc_ip_port_number,         src: DNCIPPortNo,            rule: copy}         # nvarchar(10) -> text
  - {dst: opcua_url,                  src: OPCUAURL,               rule: copy}         # nvarchar(500) -> text
  # second, third address blocks: no source columns, left NULL
  - {dst: ip_address_1, src: null, rule: set_null}
  - {dst: port_no_1,    src: null, rule: set_null}
  - {dst: protocol_1,   src: null, rule: set_null}
  - {dst: ip_address_2, src: null, rule: set_null}
  - {dst: port_no_2,    src: null, rule: set_null}
  - {dst: protocol_2,   src: null, rule: set_null}
  - {dst: ip_address_3, src: null, rule: set_null}
  - {dst: port_no_3,    src: null, rule: set_null}
  - {dst: protocol_3,   src: null, rule: set_null}

  # --- efficiency colour thresholds (smallint -> integer, widening, safe) ---
  - {dst: ae_red,    src: AERed,    rule: cast, to: integer}                           # smallint NN
  - {dst: ae_green,  src: AEGreen,  rule: cast, to: integer}                           # smallint NN
  - {dst: pe_red,    src: PERed,    rule: cast, to: integer}                           # smallint NN
  - {dst: pe_green,  src: PEGreen,  rule: cast, to: integer}                           # smallint NN
  - {dst: qe_red,    src: QERED,    rule: cast, to: integer}                           # smallint
  - {dst: qe_green,  src: QEGreen,  rule: cast, to: integer}                           # smallint
  - {dst: oee_red,   src: OERed,    rule: cast, to: integer}                           # smallint NN (source calls it OE, target OEE)
  - {dst: oee_green, src: OEGreen,  rule: cast, to: integer}                           # smallint NN (source calls it OE, target OEE)
  - {dst: opr_red,   src: OPRRed,   rule: cast, to: integer}                           # smallint
  - {dst: opr_green, src: OPRGreen, rule: cast, to: integer}                           # smallint

  - {dst: updated_at, src: UpdatedTS, rule: copy}                                          # datetime -> timestamp; the column has no DDL default, so NULL stays NULL

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence machine_information_iot_id_seq

# Source columns that move to machine_module_settings (second target, same source row)
moved_to_machine_module_settings:
  - PPEnabled
  - HelpRequestEnabled
  - AtwocEnabled
  - EshopxEnabled
  - ProgramTransferEnabled
  - ProgramFoldersEnabled
  - EnablePartCountByMacro

# Source columns with no target (not migrated, confirmed)
unmapped_source:
  - status                 # smallint
  - settings               # nvarchar(50)
  - mode                   # smallint
  - autoload               # smallint
  - MultiSpindleFlag       # bit
  - IgnoreCoFromMach       # nvarchar(10)
  - Lowerpowerthreshold    # float
  - upperpowerthreshold    # float
  - MachineType            # nvarchar(50)
  - MachineModel           # nvarchar(50)
  - SpindleAxisNumber      # int
  - SerialNumber           # nvarchar(500)
  - OEETarget              # float
  - IsTwinSpindle          # smallint
  - ChannelId              # varchar(200)
  - Separator              # varchar(200)
  - PalletEnabled          # bit
  - NoOfFixtures           # int
  - NoOfFixturesForPallet2 # int
  - NPD_PROD               # nvarchar(50)
  - ProcessType            # nvarchar(50)
  - Biometric_IPAddress    # nvarchar(50)
  - Biometric_PortNo       # int
  - PPTransferEnabled      # bit - not the same as PPEnabled; no target column

checks:
  - machine_id is NOT NULL and unique    # target has no UNIQUE constraint, but about ten tables look machines up by machine_id
  - interface_id is NOT NULL after rule

decisions:
  - "A NULL in the source follows the owner's rule: use the DDL default if the target column has one, otherwise keep NULL. This table has no DDL defaults except the iot_id sequence, so NULLs stay NULL. interface_id is the exception, because it is NOT NULL in the target."
  - "auto_setup_change_down: '1', 'Y', 'y' mean true; '0', 'N', 'n' mean false. Confirmed by owner (the lower-case 'n' is my assumption, following 'Y' / 'y'). Any other value or NULL stays NULL."

  - "interface_id = COALESCE(InterfaceID, machineid). Confirmed by owner; same rule as employee_information and rejection_code_information."
  - "ip_address_1/2/3, port_no_1/2/3, protocol_1/2/3 stay NULL (no source). Confirmed by owner."
  - "Unmapped source columns listed above are not migrated. Confirmed by owner."

  - "port_no: portno is cast to text when it has a value, otherwise NULL. Confirmed by owner. It is independent of ip_port_number (mapped from IPPortNO)."
