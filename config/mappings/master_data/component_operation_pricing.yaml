# Mapping: componentoperationpricing (SQL Server) -> master_data.component_operation_pricing (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 3 of lookup order. Depends on: component_information, machine_information.

source:
  database: TPM_PGSQL
  schema: dbo
  table: componentoperationpricing
  natural_key: [componentid, machineid, operationno]

target:
  schema: master_data
  table: component_operation_pricing
  primary_key: [iot_id]          # generated by sequence component_operation_pricing_iot_id_seq
  unique:
    - [component_iot_id, machine_iot_id, operation_no]
    - [component_id, machine_id, operation_no]
  foreign_keys:
    - {columns: [component_iot_id], references: component_information(iot_id)}
    - {columns: [machine_iot_id],   references: machine_information(iot_id)}

depends_on: [component_information, machine_information]

columns:
  # --- keys ---
  - {dst: component_iot_id, src: componentid, rule: lookup, table: component_information, match: {component_id: componentid}, return: iot_id}   # nvarchar(50) NN -> integer
  - {dst: machine_iot_id,   src: machineid,   rule: lookup, table: machine_information,   match: {machine_id: machineid}, on_miss: drop,     return: iot_id}   # nvarchar(50) NN -> integer
  - {dst: component_id,     src: componentid, rule: copy}      # nvarchar(50) NN -> text (kept as text beside the id, as in the target design)
  - {dst: machine_id,       src: machineid,   rule: copy}      # nvarchar(50) NN -> text
  - {dst: operation_no,     src: operationno, rule: copy}      # int NN          -> integer NN
  - {dst: interface_id,     src: InterfaceID, rule: copy}      # nvarchar(4)     -> text NN (never NULL in the source, see decisions)

  # --- descriptive ---
  - {dst: description,      src: description, rule: copy}      # nvarchar(100)   -> text
  - {dst: drawing_number,   src: drawingno,   rule: copy}      # nvarchar(50)    -> text

  # --- price and times (float/int -> numeric) ---
  - {dst: price,                     src: price,                  rule: cast, to: numeric}   # float
  - {dst: cycle_time,                src: cycletime,              rule: cast, to: numeric}   # float
  - {dst: load_unload,               src: loadunload,             rule: cast, to: numeric}   # bigint
  - {dst: machining_time,            src: machiningtime,          rule: cast, to: numeric}   # float
  - {dst: std_setup_time,            src: StdSetupTime,           rule: cast, to: numeric}   # float
  - {dst: incentive_time,            src: IncentiveTime,          rule: cast, to: numeric}   # float
  - {dst: target_percent,            src: TargetPercent,          rule: cast, to: numeric}   # int

  # --- thresholds ---
  - {dst: machining_time_threshold,  src: MachiningTimeThreshold, rule: cast, to: numeric}   # int
  - {dst: sci_threshold,             src: SCIThreshold,           rule: cast, to: numeric}   # float
  - {dst: dcl_threshold,             src: DCLThreshold,           rule: cast, to: numeric}   # float
  - {dst: min_load_unload_threshold, src: MinLoadUnloadThreshold, rule: cast, to: numeric}   # float
  - {dst: threshold_for_ml,          src: null,                   rule: constant, value: 0}  # no source column; constant 0 (owner's rule)

  # --- other ---
  - {dst: sub_operations,            src: SubOperations,          rule: copy}                # int -> integer
  - {dst: finished_operation_flag,   src: FinishedOperation,      rule: bool}                # int -> boolean; 0 = false, non-zero = true, NULL stays NULL
  - {dst: valid_from,                src: UpdatedTS,              rule: coalesce, fallback: load_time}   # no source column of its own; taken from UpdatedTS, NULL becomes load time (target NOT NULL)
  - {dst: valid_to,                  src: null,                   rule: set_null}                # no source; NULL
  - {dst: updated_by,                src: UpdatedBy,              rule: coalesce, fallback: pct}   # nvarchar(50) -> text; NULL becomes 'pct'
  - {dst: updated_at,                src: UpdatedTS,              rule: coalesce, fallback: load_time}   # datetime -> timestamp; NULL becomes load time

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence component_operation_pricing_iot_id_seq
  is_active: "true"                  # column default; source has no equivalent

# Source columns with no target (not migrated, confirmed)
unmapped_source:
  - slno                       # bigint NN - row number; the target generates iot_id instead
  - LowerEnergyThreshold       # float
  - UpperEnergyThreshold       # float
  - McTimeMonitorLThreshold    # float
  - McTimeMonitorUThreshold    # float
  - StdDieCloseTime            # float
  - StdPouringTime             # float
  - StdSolidificationTime      # float
  - StdDieOpenTime             # float
  - PalletCount                # int NN
  - RoboLUThreshold            # float

checks:
  - "component_iot_id is resolved for every row; machine_iot_id uses on_miss: drop"   # an unmatched component becomes NULL (the row is kept and reported); a row whose machine is not present in machine_information is not migrated and is listed as dropped_no_parent
  - "(component_iot_id, machine_iot_id, operation_no) is unique"           # target UNIQUE constraint: a duplicate cannot be loaded; it is listed in the exceptions report
  - "(component_id, machine_id, operation_no) is unique"                   # target UNIQUE constraint: a duplicate cannot be loaded; it is listed in the exceptions report
  - "interface_id is NOT NULL"                                             # target NOT NULL: a NULL cannot be loaded; it is listed in the exceptions report (owner says it never occurs)

decisions:
  - "InterfaceID is never NULL in the source. Confirmed by owner. It is copied as-is with no fallback; the NOT NULL check stays as a safety net, so a NULL would be listed in the exceptions report, not filled."

  - "valid_from = COALESCE(UpdatedTS, load time). Confirmed by owner."
  - "updated_by = COALESCE(UpdatedBy, 'pct'). Confirmed by owner (applies to every table with updated_by)."
  - "threshold_for_ml = 0 for every row (no source column, and the DDL has no default). Confirmed by owner. This is an explicit value, so it overrides the 'missing source column means NULL' convention."
  - "The unmapped source columns (energy thresholds, die/pouring/solidification times, PalletCount, RoboLUThreshold, McTimeMonitor thresholds, slno) are not migrated. Confirmed by owner."
