# Mapping: PlantEmployee (SQL Server) -> master_data.plant_employee (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 2 of lookup order. Depends on: plant_information, employee_information.

source:
  database: TPM_PGSQL
  schema: dbo
  table: PlantEmployee
  natural_key: [PlantID, EmployeeID, FromTime]

target:
  schema: master_data
  table: plant_employee
  primary_key: [id]              # generated by sequence plant_employee_id_seq; the source SlNo is not copied
  unique: []

depends_on: [plant_information, employee_information]

columns:
  - {dst: plant_iot_id,    src: PlantID,    rule: lookup, table: plant_information,    match: {plant_id: PlantID},       return: iot_id}   # nvarchar(50) NN -> integer NN
  - {dst: employee_iot_id, src: EmployeeID, rule: lookup, table: employee_information, match: {employee_id: EmployeeID}, return: iot_id}   # nvarchar(50)    -> integer; NULL EmployeeID stays NULL
  - {dst: from_time,       src: FromTime,   rule: copy}      # datetime -> timestamp without time zone
  - {dst: to_time,         src: ToTime,     rule: copy}      # datetime -> timestamp without time zone

# Target columns with no source: not written by the migration
defaults:
  id: sequence plant_employee_id_seq
  updated_at: CURRENT_TIMESTAMP      # column default; source has no UpdatedTS

# Source columns with no target
unmapped_source:
  - SlNo        # int NN - row number; the target generates id from its sequence instead

checks:
  - "plant_iot_id is resolved for every row"             # NOT NULL in the target: an unmatched PlantID cannot be loaded; it is listed in the exceptions report (owner says it does not occur)
  - "EmployeeID not NULL implies a match in employee_information"   # nullable column: an unmatched value becomes NULL, the row is still loaded, and it is listed in the exceptions report

decisions:
  - "id is generated by the target sequence; source SlNo is not migrated. Confirmed by owner. No post-load sequence step is needed."
  - "EmployeeID is never NULL in the source. Confirmed by owner. The lookup rule stays as a safety net (a NULL would stay NULL; an unmatched value becomes NULL, row kept and reported)."
