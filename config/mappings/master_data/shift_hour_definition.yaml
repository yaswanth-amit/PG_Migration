# Mapping: ShiftHourDefinition (SQL Server) -> master_data.shift_hour_definition (PostgreSQL)
# Status: all questions answered - awaiting final approval
# Wave: 2 of lookup order. Depends on: shift_details (shift_name is looked up by shift_id).

source:
  database: TPM_PGSQL
  schema: dbo
  table: ShiftHourDefinition
  natural_key: [ShiftID, HourID]

target:
  schema: master_data
  table: shift_hour_definition
  primary_key: [id]              # generated by sequence shift_hour_definition_id_seq; the source has no id column
  unique: []                     # none on the target (see checks)

depends_on: [shift_details]

columns:
  - {dst: shift_id,   src: ShiftID,   rule: copy}                                    # int NN         -> integer
  - {dst: shift_name, src: null,      rule: lookup, table: shift_details, match: {shift_id: ShiftID}, return: shift_name}   # not in the source; taken from shift_details by shift_id; no match stays NULL
  - {dst: hour_id,    src: HourID,    rule: copy}                                    # int NN         -> integer
  - {dst: hour_name,  src: HourName,  rule: copy}                                    # nvarchar(50)   -> text
  - {dst: from_day,   src: FromDay,   rule: copy}                                    # int            -> integer
  - {dst: to_day,     src: ToDay,     rule: copy}                                    # int            -> integer
  - {dst: hour_start, src: HourStart, rule: copy}                                    # datetime       -> timestamp without time zone
  - {dst: hour_end,   src: HourEnd,   rule: copy}                                    # datetime       -> timestamp without time zone
  - {dst: minutes,    src: Minutes,   rule: copy}                                    # int            -> integer
  - {dst: is_enabled, src: IsEnable,  rule: copy}                                    # bit            -> boolean
  - {dst: updated_at, src: UpdatedTS, rule: copy}                                    # datetime       -> timestamp; the column has no DDL default, so NULL stays NULL

# Target columns with no source: not written by the migration
defaults:
  id: sequence shift_hour_definition_id_seq
  updated_by: "pct"                  # no source column; constant 'pct' (owner's rule: updated_by NULL becomes 'pct')

# Source columns with no target: none
unmapped_source: []

checks:
  - "(shift_id, hour_id) is unique"              # natural key; the target has no UNIQUE constraint: validation only, rows are loaded and duplicates are listed in the exceptions report
  - "shift_id exists in shift_details"           # no foreign key in the target; rows with no matching shift are still loaded, with shift_name NULL

decisions:
  - "A NULL in the source stays NULL for every target column, because this table has no DDL defaults other than the id sequence (owner's rule: if NULL, use the DDL default, else keep NULL)."
  - "id is generated by the target sequence (the source has no id column), so no post-load sequence step is needed."
  - "shift_name is taken from shift_details (by shift_id), not from the source. Confirmed by owner. If a ShiftID has no row in shift_details, shift_name stays NULL and the row is still loaded (consistent with the keep-NULL rule)."
