# Mapping: PlantInformation (SQL Server) -> master_data.plant_information (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 1 of lookup order (no dependencies). Referenced by plant_groups, plant_machine,
#       plant_machine_groups, plant_employee, scheduled_reports.

source:
  database: TPM_PGSQL
  schema: dbo
  table: PlantInformation
  natural_key: [PlantID]

target:
  schema: master_data
  table: plant_information
  primary_key: [iot_id]          # generated by sequence plant_information_iot_id_seq
  unique: []                     # none on the target (see checks)

columns:
  - {dst: plant_id,   src: PlantID,   rule: copy}   # nvarchar(50) NN -> text NN
  - {dst: description, src: Description, rule: copy} # nvarchar(50)    -> text
  - {dst: plant_code, src: PlantCode, rule: copy}   # nvarchar(50)    -> text

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence plant_information_iot_id_seq
  updated_at: CURRENT_TIMESTAMP      # column default; source has no UpdatedTS
  updated_by: "pct"                  # no source; constant 'pct' (owner's rule: updated_by NULL becomes 'pct')

# Source columns with no target
unmapped_source:
  - SlNo        # int NN - row number; target uses iot_id instead
  - CompanyID   # nvarchar(50) - target has no company link; consistent with company_information, where CompanyID is replaced by company_name

checks:
  - plant_id is NOT NULL and unique   # target has no UNIQUE constraint, but five tables look plants up by plant_id, so duplicates would make those lookups ambiguous

decisions:
  - "CompanyID is intentionally dropped: master_data.plant_information has no company column, and plants are not linked to a company in the new design. Confirmed by owner."
