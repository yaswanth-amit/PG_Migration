# Mapping: componentinformation (SQL Server) -> master_data.component_information (PostgreSQL)
# Status: all questions answered - awaiting final approval
# Wave: 2 of lookup order. Depends on: customer_information. Referenced by component_operation_pricing.

source:
  database: TPM_PGSQL
  schema: dbo
  table: componentinformation
  natural_key: [componentid]

target:
  schema: master_data
  table: component_information
  primary_key: [iot_id]          # generated by sequence component_information_iot_id_seq
  unique: [[interface_id]]       # UNIQUE (interface_id)
  foreign_keys:
    - {columns: [customer_iot_id], references: customer_information(iot_id)}

depends_on: [customer_information]

columns:
  - {dst: customer_iot_id, src: customerid, rule: lookup, table: customer_information, match: {customer_name: customerid}, report_miss: false, return: iot_id}   # nvarchar(50) -> integer; in the SQL Server data this column holds the customer NAME (for example AMIT), so it is matched on customer_name, not customer_id; NULL stays NULL
  - {dst: interface_id,    src: InterfaceID, rule: coalesce, fallback_col: componentid}    # nvarchar(50) -> text NN UNIQUE; NULL becomes componentid
  - {dst: component_id,    src: componentid, rule: copy}                                   # nvarchar(50) NN -> text NN
  - {dst: description,     src: description, rule: copy}                                   # nvarchar(100) -> text
  - {dst: component_description_hindi, src: CompDescriptionHindi, rule: copy}               # nvarchar(100) -> text
  - {dst: basic_value,     src: basicvalue,  rule: cast, to: numeric}                       # float -> numeric
  - {dst: updated_at,      src: UpdatedTS,   rule: coalesce, fallback: load_time}           # datetime -> timestamp; NULL becomes load time

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence component_information_iot_id_seq
  is_active: "true"                  # column default; source has no equivalent

# Source columns with no target (not migrated, confirmed)
unmapped_source:
  - InputWeight      # float
  - ForegingWeight   # float
  - CaseDepth        # int

checks:
  - "component_id is NOT NULL and unique"               # target has no UNIQUE constraint, but component_operation_pricing looks components up by component_id
  - "interface_id is unique after the fallback"          # target UNIQUE constraint: a fallback value equal to another row's interface_id cannot be loaded; it is listed in the exceptions report
  - "customerid not NULL implies a match in customer_information"   # foreign key column is nullable: an unmatched value becomes NULL, the row is still loaded, and it is listed in the exceptions report

decisions:
  - "interface_id = COALESCE(InterfaceID, componentid). Confirmed by owner; same rule as the other tables."
  - "InputWeight, ForegingWeight and CaseDepth are not migrated. Confirmed by owner."
  - "componentinformation.customerid holds the customer NAME, not the customer id (customerinformation.customerid is a number such as 706 and customername is AMIT). The lookup therefore matches customer_information.customer_name = customerid. Found and confirmed by owner on 2026-11-19. A value that names no customer (for example the placeholder NONE) simply gets customer_iot_id NULL, and is NOT counted or warned about as a lookup miss (report_miss: false). Confirmed by owner."
  - "customerid can be NULL (a component with no customer is valid); customer_iot_id stays NULL. Confirmed by owner. A non-NULL customerid with no match becomes NULL and the row is kept (no rows are dropped), and it is reported."
