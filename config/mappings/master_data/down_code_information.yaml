# Mapping: downcodeinformation (SQL Server) -> master_data.down_code_information (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 2 of lookup order. Depends on: down_category.

source:
  database: TPM_PGSQL
  schema: dbo
  table: downcodeinformation
  natural_key: [downid]

target:
  schema: master_data
  table: down_code_information
  primary_key: [iot_id]          # generated by sequence down_code_information_iot_id_seq
  unique: [[interface_id]]       # UNIQUE (interface_id)
  foreign_keys:
    - {columns: [down_category_iot_id], references: down_category(iot_id)}

depends_on: [down_category]

columns:
  # --- identity ---
  - {dst: interface_id,      src: interfaceid,      rule: coalesce, fallback_col: downid}   # nvarchar(50) -> text NN UNIQUE; NULL becomes downid
  - {dst: down_id,           src: downid,           rule: copy}                             # nvarchar(100) NN -> text NN
  - {dst: down_description,  src: downdescription,  rule: copy}                             # nvarchar(100) -> text
  - {dst: down_category_iot_id, src: Catagory, rule: lookup, table: down_category, match: {category_name: Catagory}, return: iot_id}   # nvarchar(50) -> integer; NULL Catagory stays NULL

  # --- flags (smallint/int -> boolean: 0 = false, non-zero = true, NULL stays NULL) ---
  - {dst: available_efficiency,      src: availeffy,       rule: bool, null_as: ddl_default}   # smallint; NULL becomes the DDL default (false)
  - {dst: production_efficiency,     src: prodeffy,        rule: bool, null_as: ddl_default}   # smallint; NULL becomes the DDL default (false)
  - {dst: ret_per_machine_hour_flag, src: retpermchour,    rule: bool}                         # smallint; no DDL default, so NULL stays NULL
  - {dst: threshold_from_co,         src: ThresholdfromCO, rule: bool, null_as: ddl_default}   # int NN; NULL becomes the DDL default (false)
  - {dst: exclude_from_target,       src: ExcludeFromTarget, rule: copy}    # bit -> boolean

  # --- thresholds ---
  - {dst: threshold,       src: Threshold,     rule: cast, to: numeric}     # numeric(18,0) -> numeric
  - {dst: down_threshold,  src: DownThreshold, rule: cast, to: numeric}     # float         -> numeric

  # --- other ---
  - {dst: owner,       src: Owner,     rule: copy}                          # nvarchar(500) -> text
  - {dst: sort_order,  src: SortOrder, rule: copy, null_as: ddl_default}    # int           -> integer; NULL becomes the DDL default (0)
  - {dst: is_predefined,   src: downid, rule: exists_in, table: PredefinedDownCodeInfo, column: DownId}   # true if downid is listed in dbo.PredefinedDownCodeInfo.DownId, otherwise false
  - {dst: minor_down_flag, src: null,  rule: omit}                          # no source; column default (false) applies
  - {dst: updated_by,  src: null,      rule: constant, value: pct}          # no source; constant 'pct' (owner's rule)
  - {dst: updated_at,  src: UpdatedTS, rule: coalesce, fallback: load_time}   # datetime -> timestamp; NULL becomes load time

# Target columns with no source: not written by the migration
defaults:
  iot_id: sequence down_code_information_iot_id_seq
  is_active: "true"                  # column default; source has no equivalent

# Source columns with no target (not migrated, confirmed)
unmapped_source:
  - downno                 # int NN
  - Group1                 # nvarchar(50)
  - Group2                 # nvarchar(50)
  - DownDescriptionHindi   # nvarchar(100)
  - DownDescInSecLang      # nvarchar(100)
  - PE_Flag                # bit

checks:
  - "down_id is NOT NULL and unique"                    # target has no UNIQUE constraint on it, but it is the business identifier
  - "interface_id is unique after the fallback"          # target UNIQUE constraint: a duplicate cannot be loaded; it is listed in the exceptions report
  - "Catagory not NULL implies a match in down_category" # foreign key column is nullable: an unmatched value becomes NULL, the row is still loaded, and it is listed in the exceptions report

extra_source_tables:
  - table: PredefinedDownCodeInfo     # DownId nvarchar(100) NN, InterfaceID nvarchar(100); read only to set is_predefined
    used_for: is_predefined

decisions:
  - "is_predefined comes from dbo.PredefinedDownCodeInfo: true when downcodeinformation.downid equals PredefinedDownCodeInfo.DownId, false when it does not. Confirmed by owner."
  - "interface_id = COALESCE(interfaceid, downid). Confirmed by owner."
  - "minor_down_flag has no source: the DDL default (false) applies. Confirmed by owner (see _conventions.yaml, rule 'missing source column')."
  - "Unmapped source columns (downno, Group1, Group2, DownDescriptionHindi, DownDescInSecLang, PE_Flag) are not migrated. Confirmed by owner."
  - "Catagory is matched to down_category.category_name as text. A NULL Catagory stays NULL; a value with no match becomes NULL, the row is kept, and it is reported (the standing rule). Accepted by owner."
