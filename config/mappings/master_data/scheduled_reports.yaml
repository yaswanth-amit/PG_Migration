# Mapping: ScheduledReports (SQL Server) -> master_data.scheduled_reports (PostgreSQL)
# Status: DRAFT - awaiting approval
# Wave: 4 of lookup order. Depends on: plant_information, plant_groups, machine_information, shift_details.
# Conventions (null handling, no dropped rows, updated_at, lookups): see _conventions.yaml

source:
  database: TPM_PGSQL
  schema: dbo
  table: ScheduledReports
  natural_key: [Slno]

target:
  schema: master_data
  table: scheduled_reports
  primary_key: [id]              # generated by sequence scheduled_reports_id_seq; the source Slno is not copied
  unique: []

depends_on: [plant_information, plant_groups, machine_information, shift_details]

columns:
  # --- report definition (copied) ---
  - {dst: report_id,         src: ReportID,         rule: copy}      # int            -> integer
  - {dst: report_name,       src: ReportName,       rule: copy}      # nvarchar(100)  -> text
  - {dst: report_file_name,  src: ReportFileName,   rule: copy}      # nvarchar(100)  -> text
  - {dst: subject,           src: Subject,          rule: copy}      # nvarchar(500)  -> text
  - {dst: export_type,       src: ExportType,       rule: copy}      # nvarchar(100)  -> text
  - {dst: export_file_name,  src: ExportFileName,   rule: copy}      # nvarchar(100)  -> text
  - {dst: export_path,       src: ExportPath,       rule: copy, null_as: ddl_default}   # nvarchar(100) -> text; NULL becomes the DDL default ('C:\')
  - {dst: day_befores,       src: DayBefores,       rule: copy, null_as: ddl_default}   # int           -> integer; NULL becomes the DDL default (1)
  - {dst: schedule_time,     src: ScheTime,         rule: copy}      # nvarchar(100)  -> text
  - {dst: run_report_for_every, src: RunReportForEvery, rule: copy, null_as: ddl_default}   # nvarchar(10) -> text; NULL becomes the DDL default ('day')
  - {dst: run_history,       src: RunHistory,       rule: copy}      # smalldatetime  -> timestamp without time zone

  # --- scope: lookups (nullable target columns) ---
  - {dst: plant_iot_id,   src: PlantID, rule: lookup, table: plant_information, match: {plant_id: PlantID}, return: iot_id}                                  # nvarchar(50) -> integer
  - {dst: group_iot_id,   src: GroupID, rule: lookup, table: plant_groups, match: {plant_iot_id: "@plant_iot_id", group_id: GroupID}, return: iot_id}               # nvarchar(50) -> integer; a group belongs to a plant, so both keys are matched
  - {dst: machine_iot_id, src: Machine, rule: lookup, table: machine_information, match: {machine_id: Machine}, return: iot_id}                              # nvarchar(100) -> integer; Machine holds the business machine_id
  - {dst: shift_id,       src: Shift,   rule: lookup, table: shift_details, match: {shift_name: Shift}, return: shift_id}                                    # nvarchar(100) -> integer; Shift holds the shift name
  - {dst: operator,       src: Operator, rule: copy}                 # nvarchar(100)  -> text

  # --- e-mail ---
  - {dst: email_list,     src: EmailList,       rule: copy}          # nvarchar(255)  -> text
  - {dst: email_list_to,  src: Email_List_TO,   rule: copy}          # nvarchar(4000) -> text
  - {dst: email_list_cc,  src: Email_List_CC,   rule: copy}          # nvarchar(4000) -> text
  - {dst: email_list_bcc, src: Email_List_BCC,  rule: copy}          # nvarchar(4000) -> text
  - {dst: email_flag,     src: Email_Flag,      rule: copy}          # bit            -> boolean; no DDL default, so NULL stays NULL

# Target columns with no source: not written by the migration
defaults:
  id: sequence scheduled_reports_id_seq
  updated_at: CURRENT_TIMESTAMP      # column default; source has no UpdatedTS

# Source columns with no target
unmapped_source:
  - Slno        # int NN - row number; the target generates id from its sequence instead

checks:
  - "PlantID, GroupID, Machine and Shift each have a match"   # all four target columns are nullable: an unmatched value becomes NULL, the row is still loaded, and it is listed in the exceptions report

decisions:
  - "Machine holds the business machine id (machine_id). It is looked up in machine_information to get iot_id for machine_iot_id. Confirmed by owner."
  - "Shift holds the shift name (shift_name). It is looked up in shift_details by shift_name to get shift_id. Confirmed by owner."

notes:
  - "The source table has 0 rows in TPM_PGSQL, so real values could not be checked."
